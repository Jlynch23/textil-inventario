name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar
        run: ./mvnw -B clean compile

      - name: Ejecutar tests
        run: ./mvnw -B test

  # M15 (auditoria): valida que las entidades JPA calcen con las migraciones
  # Flyway arrancando el contexto de Spring contra un MySQL real. Sin esto, un
  # drift entidad<->esquema pasaba CI en verde y reventaba recien en el deploy
  # (ddl-auto: validate). Ver EsquemaFlywayTest.
  validar-esquema:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: textil_inventario
          MYSQL_USER: textil_user
          MYSQL_PASSWORD: textil_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Validar esquema (Flyway + Hibernate validate)
        env:
          RUN_DB_IT: "true"
          DB_URL: "jdbc:mysql://127.0.0.1:3306/textil_inventario?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
          DB_USERNAME: textil_user
          DB_PASSWORD: textil_pass
          # Requerida por SecurityConfig (no es secreto: solo para arrancar el contexto en CI).
          REMEMBER_ME_KEY: ci-clave-solo-para-validar-el-esquema
        run: ./mvnw -B test -Dtest=EsquemaFlywayTest,ConfirmacionConcurrenteTest,OsivFetchGraphTest -DfailIfNoTests=false

  # SUPPLY-01 (auditoria): genera un SBOM (CycloneDX) y escanea sus componentes
  # contra CVEs conocidos (Trivy). Arranca NO-BLOQUEANTE (continue-on-error +
  # exit-code 0): reporta y sube el SBOM sin romper el build. Convertirlo en gate
  # (quitar continue-on-error y poner exit-code 1, con politica de excepciones)
  # es una decision posterior, una vez visto el ruido inicial de CVEs.
  seguridad-suministro:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generar SBOM (CycloneDX)
        run: ./mvnw -B -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom

      - name: Escanear CVEs del SBOM (Trivy)
        # Se instala Trivy con su script oficial y se escanea el SBOM (en vez del
        # action aquasecurity/trivy-action, para no depender de una version de
        # action puntual). No-bloqueante: --exit-code 0 (ver comentario del job).
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy sbom target/bom.json --severity CRITICAL,HIGH --exit-code 0

      - name: Subir SBOM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: target/bom.json
          if-no-files-found: warn
