# Todos los bloques apuntan a `develop`, NO a `main`. Es la misma regla que
# el resto del proyecto: lo nuevo se prueba en develop (dev.texcontrol.pe) y
# recien cuando anda se promueve a main, que es lo que corren los clientes.
# Sin `target-branch`, Dependabot usa la rama por defecto del repo (main) y
# una actualizacion entraria directo a produccion sin pasar por staging.
version: 2
updates:
  # Dependencias de Maven (pom.xml) -- abre PRs automaticos cuando una
  # libreria tiene una version con vulnerabilidad conocida (o simplemente
  # una actualizacion disponible). No modifica el pipeline de CI: cada PR
  # que abra pasa por el mismo workflow de siempre (mvn compile + test)
  # antes de poder mergearse.
  #
  # OJO con los webjars (bootstrap, bootstrap-icons): la version va TAMBIEN
  # en la URL (`/webjars/bootstrap/5.3.0/...`), hardcodeada en las plantillas
  # y en el service worker. Un PR de Dependabot solo toca el pom.xml, asi que
  # pasa CI en verde y aun asi deja la app sin CSS ni JS. Al mergear uno de
  # esos, actualizar a mano las referencias (ver CLAUDE.md, "Convenciones").
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Imagenes base del Dockerfile (maven:3.9-eclipse-temurin-21,
  # eclipse-temurin:21-jre-jammy).
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Acciones usadas en .github/workflows/ci.yml (actions/checkout, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
