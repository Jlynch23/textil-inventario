# Todos los bloques apuntan a `develop`, NO a `main`. Es la misma regla que
# el resto del proyecto: lo nuevo se prueba en develop (dev.texcontrol.pe) y
# recien cuando anda se promueve a main, que es lo que corren los clientes.
# Sin `target-branch`, Dependabot usa la rama por defecto del repo (main) y
# una actualizacion entraria directo a produccion sin pasar por staging.
version: 2
updates:
  # Dependencias de Maven (pom.xml) -- abre PRs automaticos cuando una
  # libreria tiene una version con vulnerabilidad conocida (o simplemente
  # una actualizacion disponible). No modifica el pipeline de CI: cada PR
  # que abra pasa por el mismo workflow de siempre (mvn compile + test)
  # antes de poder mergearse.
  #
  # OJO con los webjars (bootstrap, bootstrap-icons): la version va TAMBIEN
  # en la URL (`/webjars/bootstrap/<version>/...`), hardcodeada en las
  # plantillas y en el service worker. Un PR de Dependabot solo toca el
  # pom.xml, asi que pasa CI en verde y aun asi deja la app sin CSS ni JS.
  # NO mergearlos con el boton: ver CLAUDE.md, "Actualizar un webjar".
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Imagenes base del Dockerfile (maven:3.9-eclipse-temurin-21,
  # eclipse-temurin:21-jre-jammy).
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # NO subir eclipse-temurin de major. El pom fija <java.version>21</java.version>
      # y el Dockerfile compila con 21-jdk-jammy: un PR que suba SOLO la imagen del
      # runtime (paso `stage-1`) dejaria el JAR corriendo sobre un JDK distinto al
      # que lo compilo. Ademas 21 es LTS y 22 no.
      #
      # Se bloquea unicamente el salto de MAJOR: los updates de patch/minor de la
      # linea 21 (21.0.x, que son los que traen los parches de seguridad de la JVM)
      # siguen llegando normal. Es a proposito -- no se apaga el aviso, se apaga el
      # salto de version.
      #
      # Al migrar a la proxima LTS hay que quitar esta regla Y subir <java.version>
      # en el pom en el mismo commit; las dos mitades van juntas.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  # Acciones usadas en .github/workflows/ci.yml (actions/checkout, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
