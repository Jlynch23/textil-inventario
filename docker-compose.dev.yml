# Entorno de PRUEBAS (staging) — corre la rama `develop` con su PROPIA base de
# datos, AISLADA de produccion. Se sirve en https://dev.texcontrol.pe, OCULTO
# detras de Basic Auth en el proxy multicliente. Ver STAGING.md.
#
# Se levanta con el script (usa un clon aparte del repo, en develop):
#   ./scripts/deploy-dev.sh
# O a mano, desde un clon en develop:
#   docker compose --env-file .env.dev -f docker-compose.dev.yml up -d --build
#
# app_dev se une a la red compartida del proxy multicliente (texcontrol_red, la
# crea el stack del proxy) para que `texcontrol_proxy_nginx` lo alcance por
# nombre. Su MySQL vive en una red privada (dev_interna) que NUNCA se comparte
# -> datos aislados.
#
# (Antes esto decia que se unia a `textil-inventario_default` y que lo ruteaba
# `textil_nginx`: era el stack single-cliente, decomisionado en la migracion a
# multicliente. La config de abajo ya apuntaba a texcontrol_red; el comentario
# habia quedado viejo.)

name: textil_dev

services:
  mysql_dev:
    image: mysql:8.4
    container_name: textil_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: textil_inventario
      MYSQL_USER: textil_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      # M17: hora Peru en el contenedor (ver docker-compose.yml).
      TZ: America/Lima
    command:
      - "--default-time-zone=-05:00"
      # Footprint reducido: dev tiene poca data y bajo trafico. Recorta el buffer
      # pool y apaga performance_schema (ahorra ~200-400MB) para no competir por RAM
      # con produccion en el mismo VPS. Seguro para un entorno de pruebas.
      - "--innodb-buffer-pool-size=64M"
      - "--performance-schema=OFF"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - dev_interna
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app_dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: textil-inventario-app-dev:latest
    container_name: textil_app_dev
    restart: unless-stopped
    environment:
      # Apunta al MySQL del PROPIO entorno dev (no al de produccion).
      DB_URL: jdbc:mysql://mysql_dev:3306/textil_inventario?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
      DB_USERNAME: textil_user
      DB_PASSWORD: ${DB_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DOCUMENTOS_PATH: /app/documentos
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-25MB}
      # Marca visible para no confundir dev con produccion.
      NOMBRE_EMPRESA: ${NOMBRE_EMPRESA:-DEV - Pruebas}
      # Distintivo en el login (pastilla ambar). Solo dev lo pone; prod lo deja
      # vacio y no muestra nada.
      ENTORNO_ETIQUETA: ${ENTORNO_ETIQUETA:-DEV}
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY}
      SPRING_PROFILES_ACTIVE: prod
      # Alerta de stock bajo por SMS (Twilio). Apagada si no se setea en .env.dev:
      # la app corre igual. Para la demo: poner ALERTA_STOCK_ENABLED=true + las
      # credenciales TWILIO_* y el numero verificado en TWILIO_TO.
      ALERTA_STOCK_ENABLED: ${ALERTA_STOCK_ENABLED:-false}
      ALERTA_STOCK_UMBRAL: ${ALERTA_STOCK_UMBRAL:-5}
      ALERTA_STOCK_UBICACION: ${ALERTA_STOCK_UBICACION:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_TO: ${TWILIO_TO:-}
      # Tope de heap para dev: sin esto la JVM toma por defecto ~25% de la RAM del
      # HOST (~1GB en el VPS de 4GB) y compite con produccion. Dev solo sirve para
      # probar, con 512m sobra. -XX:+ExitOnOutOfMemoryError = si se queda sin heap,
      # muere limpio (lo reinicia restart:unless-stopped) en vez de quedar "vivo pero roto".
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
    volumes:
      - ./documentos-dev:/app/documentos
    depends_on:
      mysql_dev:
        condition: service_healthy
    networks:
      # dev_interna: para alcanzar su propio MySQL (aislado).
      - dev_interna
      # proxy_red: la red COMPARTIDA del proxy multicliente (texcontrol_red), para
      # que texcontrol_proxy_nginx alcance a textil_app_dev por nombre y sirva
      # dev.texcontrol.pe. Tambien le da salida a internet (OCR/Anthropic), que
      # dev_interna al ser 'internal' no tiene. (Antes apuntaba a la red del
      # stack single-cliente 'textil-inventario_default', ya retirado.)
      - proxy_red

networks:
  dev_interna:
    driver: bridge
    internal: true
  proxy_red:
    external: true
    name: texcontrol_red

volumes:
  mysql_data_dev:
