<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Textil Inventario</title>
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="/webjars/bootstrap-icons/1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/texcontrol.css}" rel="stylesheet">
    <style>
        body {
            display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
        }
        .error-card {
            background: var(--tx-surface); border: 1px solid var(--tx-border);
            border-radius: var(--tx-radius-lg); padding: 48px; text-align: center;
            box-shadow: var(--tx-shadow); max-width: 480px;
        }
        .error-card i { font-size: 3rem; color: var(--tx-blue); }
        .error-card h3 { color: var(--tx-ink); margin-top: 16px; font-family: var(--tx-font-head); font-weight: 700; }
    </style>
</head>
<body>
    <div class="error-card">
        <i class="bi bi-exclamation-triangle"></i>
        <h3>Ocurrió un error</h3>
        <p class="text-muted">
            Algo no salió como esperabamos. El equipo técnico ya fue notificado.
            Intenta de nuevo o vuelve al inicio.
        </p>
        <a href="/" class="btn btn-primary mt-2">Volver al inicio</a>
    </div>
</body>
</html>
