<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TexControl</title>

    <!-- PWA: app movil instalable (tambien desde la pantalla de login) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0B3A66">
    <link rel="apple-touch-icon" href="/img/pwa/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TexControl">
    <script src="/js/pwa-register.js" defer></script>

    <!-- Fuentes de marca precargadas + tokens del sistema de diseño. -->
    <link rel="preload" href="/fonts/manrope-800.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <link href="/css/texcontrol.css" rel="stylesheet">
    <style>
        /* Login = pantalla propia (no usa layout/base). Fondo oscuro de marca
           (navy) + tarjeta translúcida. Todo con los tokens de texcontrol.css. */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--tx-font-body);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            color: #E6EDF5; padding: 20px;
            background:
                radial-gradient(1100px 620px at 50% -12%, #10528F 0%, #0B3A66 42%, #061F38 100%);
        }
        /* Textura sutil de puntos, casi imperceptible, para dar profundidad. */
        body::before {
            content: ""; position: fixed; inset: 0; pointer-events: none;
            background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
            background-size: 26px 26px; opacity: .5;
        }
        .card {
            position: relative;
            background: rgba(9, 30, 54, .72);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.55);
            width: 100%; max-width: 430px; padding: 42px 38px 34px; text-align: center;
        }
        /* Filo dorado superior: firma de marca discreta. */
        .card::before {
            content: ""; position: absolute; left: 22px; right: 22px; top: 0; height: 3px;
            border-radius: 0 0 3px 3px;
            background: linear-gradient(90deg, transparent, var(--tx-gold), transparent);
        }
        .logo { width: 100%; max-width: 240px; height: auto; margin: 4px auto 8px; display: block; }
        .sub {
            color: #A7BCD6; font-size: 13.5px; margin-bottom: 30px;
            font-weight: 500; letter-spacing: .01em;
        }
        label {
            display: block; text-align: left; font-weight: 600; font-size: 13.5px;
            margin-bottom: 7px; color: #CBD9EA; font-family: var(--tx-font-body);
        }
        .campo {
            display: flex; align-items: stretch; margin-bottom: 18px;
            border: 1px solid rgba(255,255,255,.14); border-radius: 10px;
            overflow: hidden; background: rgba(5, 18, 34, .6);
            transition: border-color .15s, box-shadow .15s;
        }
        .campo:focus-within {
            border-color: var(--tx-gold);
            box-shadow: 0 0 0 3px rgba(212,160,23,.22);
        }
        .campo input {
            flex: 1; border: none; outline: none; padding: 12px 14px; font-size: 16px;
            min-width: 0; background: transparent; color: #F1F6FC; font-family: var(--tx-font-body);
        }
        button[type="submit"] {
            margin-top: 8px; width: 100%; color: #fff; border: none;
            padding: 13px; border-radius: 10px; font-size: 15.5px; font-weight: 700;
            cursor: pointer; font-family: var(--tx-font-head); letter-spacing: .01em;
            background: linear-gradient(180deg, #2A7FC9 0%, #1E6FB9 100%);
            box-shadow: 0 6px 18px rgba(30,111,185,.35);
            transition: filter .15s, transform .05s;
        }
        button[type="submit"]:hover { filter: brightness(1.07); }
        button[type="submit"]:active { transform: translateY(1px); }
        .alerta { border-radius: 10px; padding: 11px 14px; font-size: 13.5px; margin-bottom: 20px; text-align: left; }
        .alerta-error { background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.35); color: #FCA5A5; }
        .alerta-ok { background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.35); color: #6EE7B7; }
        .volver { display: inline-block; margin-top: 22px; color: #8DA2BE; font-size: 13px; text-decoration: none; font-weight: 500; }
        .volver:hover { color: #F1F6FC; }
        /* Distintivo de entorno (ej. BETA en dev): pastilla ambar + borde de la
           tarjeta ambar, para no confundir staging con produccion. */
        .badge-entorno {
            display: inline-block; margin: 0 auto 14px; padding: 4px 14px;
            background: rgba(212,160,23,.18); border: 1px solid rgba(212,160,23,.6);
            color: var(--tx-gold); border-radius: 999px; font-size: 11.5px; font-weight: 800;
            letter-spacing: .14em; text-transform: uppercase; font-family: var(--tx-font-head);
        }
        .card.entorno { border-color: rgba(212,160,23,.45); }
        .card.entorno::before { background: linear-gradient(90deg, transparent, var(--tx-gold), transparent); }
    </style>
</head>
<body>
    <div class="card" th:classappend="${entornoEtiqueta != null and !entornoEtiqueta.isEmpty()} ? 'entorno' : ''">
        <img class="logo" src="/img/texcontrol-logo-recortado.png" alt="TexControl">
        <div th:if="${entornoEtiqueta != null and !entornoEtiqueta.isEmpty()}"
             class="badge-entorno" th:text="${entornoEtiqueta}">BETA</div>
        <div class="sub">Control total para la industria textil</div>

        <div th:if="${param.error}" class="alerta alerta-error">
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alerta alerta-ok">
            Sesión cerrada correctamente.
        </div>
        <div th:if="${param.expirado}" class="alerta alerta-error">
            Tu sesión expiró. Vuelve a ingresar.
        </div>

        <form th:action="@{/login}" method="post">
            <label for="username">Usuario</label>
            <div class="campo">
                <input type="text" id="username" name="username" autocomplete="username"
                       required autofocus>
            </div>

            <label for="password">Contraseña</label>
            <div class="campo">
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>

            <button type="submit">Ingresar &rarr;</button>
        </form>

        <a class="volver" href="https://texcontrol.pe">&larr; Volver a la página principal</a>
    </div>

    <script th:attr="nonce=${cspNonce}">
        // Cada vez que se llega a esta pantalla (entre una sesion y la
        // siguiente) se limpia la preferencia guardada del sidebar de
        // GERENTE, para que la proxima sesion siempre arranque con el
        // menu oculto, sin importar si en la sesion anterior lo abrieron.
        localStorage.removeItem('sidebarColapsadoGerente');
    </script>
</body>
</html>
