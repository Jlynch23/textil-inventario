<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title/text()}, ~{::section})}">
<head><title>Inicio</title></head>
<body>
<section>
    <style>
        /* Tiles de acceso rápido (mobile-first para el GERENTE). Base en tokens
           del sistema de diseño; el resto (KPIs, listas) usa componentes .tx-*. */
        .tx-tile {
            display: block; text-align: center; padding: 20px 12px;
            border-radius: var(--tx-radius-lg); background: var(--tx-surface);
            border: 1px solid var(--tx-border); box-shadow: var(--tx-shadow-sm);
            text-decoration: none; color: var(--tx-ink);
            font-family: var(--tx-font-head); font-weight: 700; font-size: 1rem;
            transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
        }
        .tx-tile i { font-size: 1.7rem; display: block; margin-bottom: 8px; color: var(--tx-blue); }
        .tx-tile:hover { box-shadow: var(--tx-shadow); transform: translateY(-1px); border-color: var(--tx-border-strong); color: var(--tx-ink); }
        .tx-loc {
            padding: 14px 16px; border-radius: var(--tx-radius);
            background: var(--tx-surface); border: 1px solid var(--tx-border);
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
    </style>

    <div class="tx-page-head"><h2><i class="bi bi-speedometer2 text-primary"></i> Resumen general</h2></div>

    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <a th:href="@{/inventario/stock}" class="tx-kpi accent-navy">
                <i class="bi bi-boxes tx-kpi-icon"></i>
                <div class="tx-kpi-label">Rollos en total</div>
                <div class="tx-kpi-value" th:text="${totalRollos}">0</div>
            </a>
        </div>
        <div class="col-6 col-lg-3">
            <a th:href="@{/transferencias}" class="tx-kpi accent-warning">
                <i class="bi bi-truck tx-kpi-icon"></i>
                <div class="tx-kpi-label">Transferencias en camino</div>
                <div class="tx-kpi-value" th:text="${transferenciasEnTransito.size()}">0</div>
            </a>
        </div>
        <div class="col-6 col-lg-3">
            <a th:href="@{/inventario/stock}" class="tx-kpi accent-danger">
                <i class="bi bi-exclamation-triangle tx-kpi-icon"></i>
                <div class="tx-kpi-label">Colores con poco stock</div>
                <div class="tx-kpi-value" th:text="${articulosStockBajo.size()}">0</div>
            </a>
        </div>
        <div class="col-6 col-lg-3">
            <a th:href="@{/programas}" class="tx-kpi accent-gold">
                <i class="bi bi-list-check tx-kpi-icon"></i>
                <div class="tx-kpi-label">Programas en proceso</div>
                <div class="tx-kpi-value" th:text="${programasEnProceso}">0</div>
            </a>
        </div>
    </div>

    <h5 class="fw-bold mb-3">Stock por depósito</h5>
    <div class="mb-4">
        <div class="tx-loc" th:each="entry : ${stockPorUbicacion}">
            <span><i class="bi bi-geo-alt me-2 text-primary"></i><span th:text="${entry.key}"></span></span>
            <span class="fw-bold tx-head" th:text="${entry.value} + ' rollos'"></span>
        </div>
        <div th:if="${stockPorUbicacion.isEmpty()}" class="tx-empty">
            <i class="bi bi-inbox"></i>No hay stock registrado todavía.
        </div>
    </div>

    <h5 class="fw-bold mb-3">Ver más</h5>
    <div class="row g-3">
        <div class="col-6 col-lg-3">
            <a th:href="@{/inventario/stock}" class="tx-tile">
                <i class="bi bi-boxes"></i>Stock actual
            </a>
        </div>
        <div class="col-6 col-lg-3">
            <a th:href="@{/catalogo/colores}" class="tx-tile">
                <i class="bi bi-palette"></i>Colores
            </a>
        </div>
        <div class="col-6 col-lg-3">
            <a th:href="@{/programas}" class="tx-tile">
                <i class="bi bi-list-check"></i>Programas
            </a>
        </div>
        <div class="col-6 col-lg-3">
            <a th:href="@{/documentos}" class="tx-tile">
                <i class="bi bi-file-earmark-pdf"></i>Guías
            </a>
        </div>
        <div class="col-12">
            <a th:href="@{/transferencias}" class="tx-tile">
                <i class="bi bi-arrow-left-right"></i>Transferencias
            </a>
        </div>
    </div>
</section>
</body>
</html>
