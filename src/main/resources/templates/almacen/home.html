<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacén</title>
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="/webjars/bootstrap-icons/1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preload" href="/fonts/manrope-800.woff2" as="font" type="font/woff2" crossorigin>
    <link href="/css/texcontrol.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh; display: flex; align-items: center;
            background: radial-gradient(900px 500px at 50% -10%, #10528F 0%, var(--tx-navy) 45%, #061F38 100%);
        }
        .brand-almacen img { height: 56px; }
        .brand-almacen h3 { font-family: var(--tx-font-head); font-weight: 800; letter-spacing: .02em; }
        .btn-grande {
            font-size: 1.35rem; padding: 38px 20px; border-radius: var(--tx-radius-lg);
            font-weight: 700; font-family: var(--tx-font-head);
        }
    </style>
</head>
<body>
<div class="container" style="max-width: 460px;">
    <div class="text-center mb-5 brand-almacen">
        <img src="/img/texcontrol-icono.png" alt="TexControl" class="mb-2">
        <h3 class="text-white mb-1">TEXCONTROL</h3>
        <p class="text-white-50 mb-0">Panel de Almacén</p>
    </div>
    <div class="row g-3">
        <div class="col-12">
            <a href="/almacen/entrada" class="btn btn-success btn-grande w-100 d-flex flex-column align-items-center">
                <i class="bi bi-box-arrow-in-down" style="font-size: 3rem;"></i>
                Registrar ENTRADA
            </a>
        </div>
        <div class="col-12">
            <a href="/almacen/salida" class="btn btn-warning btn-grande w-100 d-flex flex-column align-items-center">
                <i class="bi bi-box-arrow-up" style="font-size: 3rem;"></i>
                Registrar SALIDA
            </a>
        </div>
        <div class="col-12 mt-4">
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light w-100">
                    <i class="bi bi-box-arrow-left me-2"></i>Cerrar Sesión
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
