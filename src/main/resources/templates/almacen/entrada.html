<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Registrar Entrada</title>
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="/webjars/bootstrap-icons/1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/texcontrol.css}" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .btn-camara {
            border: 2px dashed var(--tx-success);
            border-radius: var(--tx-radius-lg);
            padding: 40px 20px; text-align: center;
            background: var(--tx-surface); cursor: pointer;
        }
        .form-control-lg { font-size: 1.3rem; padding: 16px; }
        #preview { max-width: 100%; border-radius: var(--tx-radius); margin-top: 12px; display: none; }
    </style>
</head>
<body>
<div class="container">
    <a href="/almacen" class="btn btn-light mb-3"><i class="bi bi-arrow-left"></i> Volver</a>
    <h4 class="fw-bold mb-4 text-success"><i class="bi bi-box-arrow-in-down me-2"></i>Registrar Entrada</h4>

    <form th:action="@{/almacen/entrada}" method="post" enctype="multipart/form-data" id="formEntrada">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label class="btn-camara d-block mb-4" for="fotoInput">
            <i class="bi bi-camera-fill" style="font-size: 3rem; color: var(--tx-success);"></i>
            <p class="fw-bold mt-2 mb-0">Tomar Foto de la Guía</p>
            <small class="text-muted">Toca para abrir la cámara</small>
            <img id="preview" alt="Vista previa de la foto de la guía">
        </label>
        <input type="file" id="fotoInput" name="foto" accept="image/*" capture="environment" required style="display:none;">

        <div class="mb-4">
            <label for="totalRollos" class="form-label fw-bold fs-5">Total de Rollos</label>
            <input type="number" id="totalRollos" name="totalRollos" class="form-control form-control-lg" required min="1">
        </div>

        <button type="submit" class="btn btn-success btn-lg w-100 py-3 fw-bold">
            <i class="bi bi-check-lg me-2"></i>Guardar Entrada
        </button>
    </form>
</div>

<script th:attr="nonce=${cspNonce}">
    document.getElementById('fotoInput').addEventListener('change', function() {
        if (this.files && this.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('preview');
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(this.files[0]);
        }
    });

    // Auditoria (doble-submit): el submit solo se dispara si pasa la validacion
    // HTML5 (foto + cantidad requeridas); ahi se deshabilita el boton para que un
    // doble-toque no registre la entrada dos veces.
    document.getElementById('formEntrada').addEventListener('submit', function () {
        const b = this.querySelector('button[type="submit"]');
        if (b) { b.disabled = true; b.textContent = 'Guardando...'; }
    });
</script>
</body>
</html>
