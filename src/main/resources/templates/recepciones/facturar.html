<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title/text()}, ~{::section})}">
<head><title>Asignar Factura</title></head>
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-md-9">

            <div class="card mb-4">
                <div class="card-body p-4">
                    <h6 class="fw-bold mb-3"><i class="bi bi-file-earmark-arrow-up me-2"></i>Subir PDF de Factura (opcional)</h6>
                    <p class="text-muted small mb-3">Sube la factura y el sistema leerá el número automáticamente.</p>
                    <div class="input-group">
                        <input type="file" id="pdfFactura" class="form-control" accept="application/pdf">
                        <button type="button" class="btn btn-primary" id="btnExtraerFactura">
                            <i class="bi bi-magic me-1"></i>Leer Factura
                        </button>
                    </div>
                    <div id="estadoFactura" class="mt-2"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-body p-4">
                    <h6 class="fw-bold mb-3">Asignar a Guías Pendientes de Facturar</h6>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Número de Factura</label>
                            <input type="text" class="form-control" id="numeroFacturaInput">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Fecha de Factura</label>
                            <input type="date" class="form-control" id="fechaFacturaInput">
                        </div>
                    </div>

                    <div class="table-responsive mb-3">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th style="width: 40px;"></th>
                                    <th>Guía</th>
                                    <th>Empresa</th>
                                    <th>Fecha</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${recepciones.empty}">
                                    <td colspan="5" class="text-center text-muted py-4">No hay guías pendientes de facturar.</td>
                                </tr>
                                <!-- Click en la fila = ver el detalle de la recepcion, igual que
                                     en Programas, pero en una PESTAÑA NUEVA: esta pantalla existe
                                     para marcar varias guias y asignarles una factura, y navegar
                                     en la misma pestaña perderia lo ya tildado.
                                     La celda del checkbox no navega (ahi se tilda). -->
                                <tr th:each="r : ${recepciones}" style="cursor:pointer;"
                                    th:onclick="'window.open(\'' + @{/recepciones/{id}/detalle(id=${r.id})} + '\', \'_blank\')'">
                                    <td onclick="event.stopPropagation()">
                                        <input type="checkbox" class="form-check-input chk-recepcion" th:value="${r.id}">
                                    </td>
                                    <td>
                                        <code th:text="${r.numeroGuia}"></code>
                                        <!-- El ojito ya abre el PDF en pestaña nueva; sin cortar la
                                             propagacion, un click en el ojo abriria DOS pestañas
                                             (la del enlace y la de la fila). -->
                                        <span th:if="${guiaPorRecepcion.containsKey(r.id)}" onclick="event.stopPropagation()">
                                            <span th:replace="~{fragments/guias :: ojoGuia(${guiaPorRecepcion.get(r.id)})}"></span>
                                        </span>
                                    </td>
                                    <td th:text="${r.empresa.nombre}"></td>
                                    <td th:text="${r.fechaGuia != null ? #temporals.format(r.fechaGuia, 'dd/MM/yyyy') : '-'}"></td>
                                    <td>
                                        <span th:text="${r.estado}"
                                              th:class="${r.estado.name() == 'CONFIRMADA'} ? 'badge bg-success' : 'badge bg-secondary'"></span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div id="errorAsignar" class="text-danger small mb-2"></div>
                    <button type="button" class="btn btn-primary w-100" id="btnAsignarFactura">
                        <i class="bi bi-check-lg me-1"></i>Asignar Factura a Guías Seleccionadas
                    </button>
                    <a th:href="@{/recepciones}" class="btn btn-light w-100 mt-2">Volver</a>
                </div>
            </div>

        </div>
    </div>

    <script th:src="@{/js/facturacion-ocr.js}"></script>
</section>
</body>
</html>
