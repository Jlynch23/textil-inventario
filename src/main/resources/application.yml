spring:
  application:
    name: textil-inventario

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/textil_inventario?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
    username: ${DB_USERNAME:textil_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # #9 (auditoria): open-in-view APAGADO. Con OSIV, la sesion de Hibernate
    # quedaba abierta durante TODO el render de la vista, sosteniendo una conexion
    # del pool mas de lo necesario y escondiendo accesos LAZY mal planificados
    # (N+1 silenciosos). Apagado, cada request cierra la sesion al terminar la
    # capa de servicio; las vistas reciben las entidades con lo que necesitan YA
    # cargado (via @EntityGraph/JOIN FETCH en los finders, o forzando la
    # inicializacion dentro de @Transactional). Si una pantalla nueva accede a una
    # asociacion no precargada, fallara de inmediato con LazyInitializationException
    # (en dev) en vez de degradar el rendimiento en silencio -- eso es deseado.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        # #9 (auditoria): al acceder a una asociacion LAZY de N entidades ya
        # cargadas (p.ej. los detalles de varias recepciones, o una @ManyToOne
        # LAZY por fila), Hibernate las trae en lotes con un IN (:ids) en vez de
        # un SELECT por entidad (N+1). Es una mejora global y SIN riesgo: no
        # cambia el resultado, solo cuantos queries se emiten.
        default_batch_fetch_size: 16

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: false
    encoding: UTF-8

  # Cache-busting de estaticos propios (/css, /js, /img): Spring agrega un hash
  # de contenido a la URL (p.ej. /css/texcontrol-3f9a1c.css). Cuando el archivo
  # cambia, cambia la URL, asi el navegador Y el service worker (cache-first en
  # sw.js) lo ven como recurso nuevo y lo bajan solos -> los cambios de estilo/JS
  # llegan a TODOS sin hard refresh ni tener que subir CACHE_VERSION a mano.
  # Requiere que las plantillas referencien los estaticos con @{...} (th:href/
  # th:src) para que Spring reescriba la URL con el hash. Las URLs SIN hash
  # siguen resolviendo al archivo real (fallback), asi el manifest/sw/precache y
  # cualquier ref cruda no se rompen.
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths:
              - /css/**
              - /js/**
              - /img/**

  # SMTP para la alerta de stock bajo por CORREO (NotificadorEmailSmtp).
  # Default Gmail: requiere una "contraseña de aplicación" (no la clave normal)
  # en MAIL_PASSWORD. Sin credenciales el canal queda apagado (la app arranca
  # igual y solo se loggea el aviso no enviado). Timeouts acotados: corre en el
  # hilo @Async de la alerta y un SMTP caído no debe colgarlo (regla SEC-03).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 15000

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${MAX_UPLOAD_SIZE:25MB}
    session:
      # La cookie de sesion (JSESSIONID) igual dura la jornada; el "recordar
      # sesion" (remember-me, ver SecurityConfig) es lo que mantiene logueado
      # al usuario en el celular cuando la PWA se suspende y esta cookie cae.
      timeout: 8h
      cookie:
        # SameSite=Lax evita que el navegador descarte la cookie al reabrir la
        # PWA desde el icono del escritorio (contexto de navegacion top-level).
        same-site: lax
        http-only: true

server:
  port: 8080
  # Detras de nginx (que termina el TLS), la app recibe las requests por HTTP
  # interno. Sin esto, Spring genera redirects a http:// y cookies sin Secure
  # cuando el usuario entro por https -> loops de login. 'framework' hace que
  # honre X-Forwarded-Proto/For que nginx ya envia.
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: WARN
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

documentos:
  ruta-base: ${DOCUMENTOS_PATH:./documentos}

# Alerta de stock bajo por SMS (Twilio). Apagada por defecto: si no se configura,
# la app funciona igual y no manda nada. Al activarla, cuando una SALIDA deja a un
# artículo/color por debajo del umbral en la ubicación vigilada, se manda un SMS
# (post-commit, async, 1 aviso por artículo+color por día). Migrar a WhatsApp más
# adelante = cambiar la implementación de NotificadorStockBajo, sin tocar esto.
alerta:
  stock:
    enabled: ${ALERTA_STOCK_ENABLED:false}
    umbral: ${ALERTA_STOCK_UMBRAL:5}
    # Nombre de la ubicación a vigilar. Vacío = todas las salidas (hoy = Praderas).
    ubicacion: ${ALERTA_STOCK_UBICACION:}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from: ${TWILIO_FROM:}
  # Uno o varios destinatarios en formato E.164, separados por coma (+51987654321).
  to: ${TWILIO_TO:}

# Canal de CORREO de la alerta de stock bajo (el activo, @Primary). Los
# destinatarios van por config (los usuarios ya no tienen email en la BD, V28).
alerta.email:
  # Uno o varios correos separados por coma. Vacío = canal apagado.
  to: ${ALERTA_EMAIL_TO:}
  # Remitente; vacío = se usa MAIL_USERNAME (lo usual en Gmail).
  from: ${ALERTA_EMAIL_FROM:}

app:
  nombre-empresa: ${NOMBRE_EMPRESA:Laura & Clemente}
  # Etiqueta del entorno (ej. "BETA"). Vacia en produccion; el stack de dev
  # (docker-compose.dev.yml) la pone en "BETA" para distinguir el login de
  # staging del de produccion de un vistazo. Ver login.html.
  entorno-etiqueta: ${ENTORNO_ETIQUETA:}
  # Clave que firma la cookie "recordar sesion" (remember-me). Debe fijarse por
  # instancia (valor unico y secreto) y NO cambiar entre despliegues, o los
  # usuarios quedan deslogueados en cada reinicio. El default es solo para dev.
  remember-me-key: ${REMEMBER_ME_KEY}
---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    org.springframework.security: DEBUG
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    org.springframework.security: WARN

