<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TexControl — Ingreso</title>
    <meta name="theme-color" content="#0B3A66">
    <link rel="preload" href="/fonts/manrope-800.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        /* Lanzador de login.texcontrol.pe: mismo look que el login de la app
           (navy de marca + filo dorado + Manrope/Inter). Estatico, sin build. */
        @font-face { font-family:'Manrope'; font-weight:800; font-display:swap; src:url('/fonts/manrope-800.woff2') format('woff2'); }
        @font-face { font-family:'Inter'; font-weight:400; font-display:swap; src:url('/fonts/inter-400.woff2') format('woff2'); }
        @font-face { font-family:'Inter'; font-weight:600; font-display:swap; src:url('/fonts/inter-600.woff2') format('woff2'); }
        :root { --azul:#1E6FB9; --oro:#D4A017; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            color: #E6EDF5; padding: 20px; -webkit-font-smoothing: antialiased;
            background: radial-gradient(1100px 620px at 50% -12%, #10528F 0%, #0B3A66 42%, #061F38 100%);
        }
        body::before {
            content: ""; position: fixed; inset: 0; pointer-events: none;
            background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
            background-size: 26px 26px; opacity: .5;
        }
        .card {
            position: relative; background: rgba(9,30,54,.72); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.55);
            width: 100%; max-width: 440px; padding: 42px 38px; text-align: center;
        }
        .card::before {
            content: ""; position: absolute; left: 22px; right: 22px; top: 0; height: 3px;
            border-radius: 0 0 3px 3px;
            background: linear-gradient(90deg, transparent, var(--oro), transparent);
        }
        .logo { width: 100%; max-width: 240px; height: auto; margin: 4px auto 8px; display: block; }
        .sub { color: #A7BCD6; font-size: 14px; margin-top: 2px; margin-bottom: 28px; font-weight: 500; }
        label { display:block; text-align:left; font-weight:600; font-size:14px; margin-bottom:8px; color:#CBD9EA; }
        .campo { display: flex; align-items: stretch; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; overflow: hidden; background:rgba(5,18,34,.6); }
        .campo:focus-within { border-color: var(--oro); box-shadow: 0 0 0 3px rgba(212,160,23,.22); }
        .campo input { flex: 1; border: none; outline: none; padding: 12px 14px; font-size: 16px; min-width: 0; background: transparent; color: #F1F6FC; }
        .campo .suf { display:flex; align-items:center; padding: 0 12px; background:rgba(255,255,255,.05); color:#8DA2BE; font-size:14px; white-space:nowrap; border-left:1px solid rgba(255,255,255,.12); }
        button {
            margin-top: 22px; width: 100%; color: #fff; border: none;
            padding: 13px; border-radius: 10px; font-size: 15.5px; font-weight: 700; cursor: pointer;
            font-family: 'Manrope', system-ui, sans-serif; letter-spacing: .01em;
            background: linear-gradient(180deg, #2A7FC9 0%, #1E6FB9 100%);
            box-shadow: 0 6px 18px rgba(30,111,185,.35); transition: filter .15s, transform .05s;
        }
        button:hover { filter: brightness(1.07); }
        button:active { transform: translateY(1px); }
        .ayuda { margin-top: 18px; font-size: 12.5px; color: #8DA2BE; }
        .volver { display: inline-block; margin-top: 16px; color: #8DA2BE; font-size: 13px; text-decoration: none; font-weight: 500; }
        .volver:hover { color: #F1F6FC; }
        .error { color: #f87171; font-size: 13px; margin-top: 10px; min-height: 18px; text-align:left; }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="logo.png" alt="TexControl ERP">
        <div class="sub">Control total para la industria textil</div>

        <form id="form" onsubmit="return ir(event)">
            <label for="empresa">Ingresa el nombre de tu empresa</label>
            <div class="campo">
                <input id="empresa" type="text" autocomplete="off" autofocus>
                <span class="suf">.texcontrol.pe</span>
            </div>
            <div class="error" id="error"></div>
            <button type="submit">Ingresar &rarr;</button>
        </form>

        <div class="ayuda">Escribe el nombre de tu empresa y te llevamos a tu sistema.</div>
        <a class="volver" href="https://texcontrol.pe">&larr; Volver a la página principal</a>
    </div>

    <script>
        // Normaliza lo que escribe el cliente a un slug de subdominio.
        // normalize('NFD') separa la tilde de la letra (a + acento); luego, al
        // dejar solo a-z0-9, el acento se descarta y "á" queda en "a".
        function slug(txt) {
            return txt.normalize('NFD').toLowerCase().replace(/[^a-z0-9]/g, '');
        }
        function ir(e) {
            e.preventDefault();
            var s = slug(document.getElementById('empresa').value);
            var err = document.getElementById('error');
            if (!s) { err.textContent = 'Escribe el nombre de tu empresa.'; return false; }
            err.textContent = '';
            window.location.href = 'https://' + s + '.texcontrol.pe';
            return false;
        }
    </script>
</body>
</html>
